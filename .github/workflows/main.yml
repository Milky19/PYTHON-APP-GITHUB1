name: PYTHON-PROJECT

on:
  workflow_dispatch:
    inputs:
      n1:
        description: First integer
        required: true
        type: string
      n2:
        description: Second integer
        required: true
        type: string

jobs:
  python-ci:
    name: python-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python version
        run: python --version

      - name: Compile the app
        run: python -m py_compile app.py

      - name: Run the Python app with input values
        env:
          n1: ${{ inputs.n1 }}
          n2: ${{ inputs.n2 }}
        run: |
          echo "First number is: $n1"
          echo "Second number is: $n2"
          printf '%s\n%s\n' "$n1" "$n2" | python app.py
